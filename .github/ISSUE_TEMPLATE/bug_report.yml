name: Bug report
description: Report a reproducible problem with SWISSINNO Trap Card
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a problem. Remove sensitive entity names and personal information before submitting.
  - type: input
    id: card-version
    attributes:
      label: Card version
      placeholder: v0.1.0
    validations:
      required: true
  - type: input
    id: home-assistant-version
    attributes:
      label: Home Assistant version
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: configuration
    attributes:
      label: Card configuration
      render: yaml
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Browser console output
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for the same problem.
          required: true
        - label: I removed sensitive or identifying information.
          required: true

